// Fuzzy Matching Algorithms
function levenshteinDistance(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

function wordMatchesFuzzy(word, target, maxDist = 2) {
    word = word.toLowerCase().trim();
    target = target.toLowerCase().trim();
    if (word === target) return true;
    if (word.includes(target) || target.includes(word)) return true;
    if (Math.abs(word.length - target.length) > maxDist) return false;
    return levenshteinDistance(word, target) <= maxDist;
}

function checkConceptFuzzy(text, keywords) {
    const cleanText = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
    const textWords = cleanText.split(/\s+/).filter(w => w.length > 0);

    for (let kw of keywords) {
        const kwLower = kw.toLowerCase();
        if (cleanText.includes(kwLower)) return true;
        
        const kwTokens = kwLower.split(/\s+/);
        if (kwTokens.length === 1) {
            if (textWords.some(w => wordMatchesFuzzy(w, kwTokens[0]))) return true;
        } else {
            let matchAll = kwTokens.every(token => textWords.some(w => wordMatchesFuzzy(w, token)));
            if (matchAll) return true;
        }
    }
    return false;
}

function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    if (!container) return;
    container.innerHTML = '';

    questionsData.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card_${q.id}`;

        card.innerHTML = `
            <div class="question-header">
                <div class="question-title">${q.title}</div>
                <div class="marks-badge">${q.marks} Marks Available</div>
            </div>
            ${q.context ? `<div class="question-context">${q.context}</div>` : ''}
            <div class="question-text">${q.question}</div>
            <textarea id="ans_${q.id}" placeholder="Type your answer here..." oninput="autoSave()"></textarea>
            <div class="feedback-box" id="feedback_${q.id}"></div>
        `;
        container.appendChild(card);
    });
}

// Auto Save & Load
function autoSave() {
    const studentName = document.getElementById('studentName') ? document.getElementById('studentName').value : '';
    const answers = {};

    questionsData.forEach(q => {
        const el = document.getElementById(`ans_${q.id}`);
        answers[q.id] = el ? el.value : '';
    });

    const data = {
        name: studentName,
        answers: answers,
        timestamp: new Date().toISOString()
    };

    safeSetStorage('pe_revision_data', JSON.stringify(data));

    const statusMsg = document.getElementById('saveStatus');
    if (statusMsg) {
        statusMsg.style.display = 'inline';
        setTimeout(() => { statusMsg.style.display = 'none'; }, 2000);
    }

    updateStats();
}

function manualSave() {
    autoSave();
    alert('Progress saved successfully to your browser session!');
}

function loadSavedData() {
    const saved = safeGetStorage('pe_revision_data');
    if (!saved) return;

    try {
        const data = JSON.parse(saved);
        if (data.name && document.getElementById('studentName')) {
            document.getElementById('studentName').value = data.name;
        }
        if (data.answers) {
            questionsData.forEach(q => {
                const el = document.getElementById(`ans_${q.id}`);
                if (el && data.answers[q.id] !== undefined) {
                    el.value = data.answers[q.id];
                }
            });
        }
        updateStats();
    } catch(e) {}
}

function updateStats() {
    let attempted = 0;
    questionsData.forEach(q => {
        const el = document.getElementById(`ans_${q.id}`);
        const text = el ? el.value.trim() : '';
        if (text.length > 5) attempted++;
    });

    const statsEl = document.getElementById('overallStats');
    if (statsEl) {
        statsEl.innerText = `Attempted: ${attempted}/13 Questions`;
    }
}

// Marking Engine
function markAllAttempted() {
    let totalScore = 0;
    let totalAttemptedMarks = 0;
    let attemptedCount = 0;

    questionsData.forEach(q => {
        const textarea = document.getElementById(`ans_${q.id}`);
        const feedbackBox = document.getElementById(`feedback_${q.id}`);
        if (!textarea || !feedbackBox) return;

        const userText = textarea.value.trim();

        // Gated Feedback: Only show model answers/marks for attempted questions
        if (userText.length < 6) {
            feedbackBox.className = 'feedback-box visible unattempted';
            feedbackBox.innerHTML = `
                <div class="score-display">⚠️ Question Not Attempted</div>
                <p>Please write your response in the box above before requesting marks. Model answers and feedback are hidden until you attempt the question.</p>
            `;
            return;
        }

        attemptedCount++;
        let qScore = 0;
        let criteriaHTML = '<ul class="criteria-list">';

        q.criteria.forEach(crit => {
            const isMatched = checkConceptFuzzy(userText, crit.keywords);
            if (isMatched) {
                qScore += crit.points;
                criteriaHTML += `<li class="matched">✓ [${crit.points} mark(s)] ${crit.text}</li>`;
            } else {
                criteriaHTML += `<li class="missed">✗ [0/${crit.points} mark(s)] ${crit.text}</li>`;
            }
        });

        if (qScore > q.marks) qScore = q.marks;
        totalScore += qScore;
        totalAttemptedMarks += q.marks;

        criteriaHTML += '</ul>';

        feedbackBox.className = 'feedback-box visible graded';
        feedbackBox.innerHTML = `
            <div class="score-display">Mark Awarded: ${qScore} / ${q.marks}</div>
            <strong>Mark Scheme Breakdown:</strong>
            ${criteriaHTML}
            <div class="model-answer">
                <div class="model-answer-title">Model Answer / Key Points:</div>
                ${q.modelAnswer}
            </div>
        `;
    });

    const statsEl = document.getElementById('overallStats');
    if (statsEl) {
        statsEl.innerText = `Attempted: ${attemptedCount}/13 | Total Score: ${totalScore} / ${totalAttemptedMarks} (Max 48)`;
    }
    alert(`Marking Complete!\nYou scored ${totalScore} mark(s) across ${attemptedCount} attempted question(s).`);
}

// Export / Download Helpers
function generateHTMLDocumentContent() {
    const nameInput = document.getElementById('studentName');
    const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Student';
    const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    let docHTML = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
            <meta charset='utf-8'>
            <title>PE Revision Guide: Recovery of Energy Systems</title>
            <style>
                body { font-family: Arial, sans-serif; line-height: 1.5; color: #111; padding: 20px; }
                h1 { color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 5px; }
                .meta { background: #f1f5f9; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
                .q-block { margin-bottom: 25px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
                .q-title { font-weight: bold; color: #1e3a8a; font-size: 1.1em; }
                .q-context { background: #f8fafc; font-style: italic; padding: 8px; margin: 5px 0; }
                .user-ans { background: #f0f9ff; border-left: 3px solid #0284c7; padding: 10px; margin: 10px 0; }
                .model-ans { background: #f0fdf4; border-left: 3px solid #16a34a; padding: 10px; margin: 10px 0; }
            </style>
        </head>
        <body>
            <h1>PE Revision Guide: Recovery of Energy Systems</h1>
            <div class="meta">
                <p><strong>Student Name:</strong> ${name}</p>
                <p><strong>Date Completed:</strong> ${dateStr}</p>
            </div>
    `;

    questionsData.forEach(q => {
        const el = document.getElementById(`ans_${q.id}`);
        const userText = el ? el.value.trim() : '';

        docHTML += `
            <div class="q-block">
                <div class="q-title">${q.title} (${q.marks} Marks)</div>
                ${q.context ? `<div class="q-context">${q.context}</div>` : ''}
                <p><strong>Question:</strong> ${q.question}</p>
                <div class="user-ans">
                    <strong>Student Answer:</strong><br>
                    ${userText ? userText.replace(/\n/g, '<br>') : '<i>No answer provided.</i>'}
                </div>
                <div class="model-ans">
                    <strong>Model Answer / Key Points:</strong><br>
                    ${q.modelAnswer}
                </div>
            </div>
        `;
    });

    docHTML += `</body></html>`;
    return docHTML;
}

function exportGoogleDoc() {
    const nameInput = document.getElementById('studentName');
    const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Student';
    const htmlContent = generateHTMLDocumentContent();
    const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name.replace(/\s+/g, '_')}_Recovery_of_Energy_Systems.doc`;
    a.click();
}

function copyForGoogleDoc() {
    const htmlContent = generateHTMLDocumentContent();
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const clipboardItem = new ClipboardItem({ 'text/html': blob });

    navigator.clipboard.write([clipboardItem]).then(() => {
        alert('Formatted revision work copied to clipboard! Open Google Docs and press Ctrl+V (or Cmd+V) to paste.');
    }).catch(() => {
        alert('Clipboard copy restricted by browser. Please use "Download as Google Doc" instead.');
    });
}

function exportJSON() {
    const saved = safeGetStorage('pe_revision_data');
    if (!saved) {
        alert('No saved answers found to backup.');
        return;
    }
    const blob = new Blob([saved], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `PE_Revision_Backup.json`;
    a.click();
}

// Guarantee execution regardless of document state
function initApp() {
    renderQuestions();
    loadSavedData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
} else {
    initApp();
}
</script>
