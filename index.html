// Fuzzy Matching Helper Functions
function levenshteinDistance(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

function wordMatchesFuzzy(word, target, maxDist = 2) {
    word = word.toLowerCase().trim();
    target = target.toLowerCase().trim();
    if (word === target) return true;
    if (word.includes(target) || target.includes(word)) return true;
    if (Math.abs(word.length - target.length) > maxDist) return false;
    return levenshteinDistance(word, target) <= maxDist;
}

function checkConceptFuzzy(text, keywords) {
    const cleanText = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
    const textWords = cleanText.split(/\s+/).filter(w => w.length > 0);

    for (let kw of keywords) {
        const kwLower = kw.toLowerCase();
        if (cleanText.includes(kwLower)) return true;
        
        const kwTokens = kwLower.split(/\s+/);
        if (kwTokens.length === 1) {
            if (textWords.some(w => wordMatchesFuzzy(w, kwTokens[0]))) return true;
        } else {
            let matchAll = kwTokens.every(token => textWords.some(w => wordMatchesFuzzy(w, token)));
            if (matchAll) return true;
        }
    }
    return false;
}

// Render Questions
function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    questionsData.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card_${q.id}`;

        card.innerHTML = `
            <div class="question-header">
                <div class="question-title">${q.title}</div>
                <div class="marks-badge">${q.marks} Marks Available</div>
            </div>
            ${q.context ? `<div class="question-context">${q.context}</div>` : ''}
            <div class="question-text">${q.question}</div>
            <textarea id="ans_${q.id}" placeholder="Type your answer here..." oninput="autoSave()"></textarea>
            
            <div class="feedback-box" id="feedback_${q.id}"></div>
        `;
        container.appendChild(card);
    });
}

// Auto Save & Local Storage
function autoSave() {
    const studentName = document.getElementById('studentName').value;
    const answers = {};

    questionsData.forEach(q => {
        const val = document.getElementById(`ans_${q.id}`).value;
        answers[q.id] = val;
    });

    const data = {
        name: studentName,
        answers: answers,
        timestamp: new Date().toISOString()
    };

    localStorage.setItem('pe_revision_data', JSON.stringify(data));

    const statusMsg = document.getElementById('saveStatus');
    statusMsg.style.display = 'inline';
    setTimeout(() => { statusMsg.style.display = 'none'; }, 2000);

    updateStats();
}

function manualSave() {
    autoSave();
    alert('Progress saved successfully to your browser local storage!');
}

function loadSavedData() {
    const saved = localStorage.getItem('pe_revision_data');
    if (!saved) return;

    try {
        const data = JSON.parse(saved);
        if (data.name) document.getElementById('studentName').value = data.name;
        if (data.answers) {
            questionsData.forEach(q => {
                if (data.answers[q.id] !== undefined) {
                    document.getElementById(`ans_${q.id}`).value = data.answers[q.id];
                }
            });
        }
        updateStats();
    } catch(e) {
        console.error("Failed to load saved data", e);
    }
}

function updateStats() {
    let attempted = 0;
    questionsData.forEach(q => {
        const text = document.getElementById(`ans_${q.id}`) ? document.getElementById(`ans_${q.id}`).value.trim() : '';
        if (text.length > 5) attempted++;
    });

    document.getElementById('overallStats').innerText = `Attempted: ${attempted}/13 Questions`;
}

// Grading Logic
function markAllAttempted() {
    let totalScore = 0;
    let totalAttemptedMarks = 0;
    let attemptedCount = 0;

    questionsData.forEach(q => {
        const textarea = document.getElementById(`ans_${q.id}`);
        const feedbackBox = document.getElementById(`feedback_${q.id}`);
        const userText = textarea.value.trim();

        // Check if question is FULLY attempted (at least 6 characters)
        if (userText.length < 6) {
            feedbackBox.className = 'feedback-box visible unattempted';
            feedbackBox.innerHTML = `
                <div class="score-display">⚠️ Question Not Attempted</div>
                <p>Please write your answer above before requesting marks. Model answers and feedback are hidden until you attempt the question.</p>
            `;
            return;
        }

        attemptedCount++;
        let qScore = 0;
        let criteriaHTML = '<ul class="criteria-list">';

        q.criteria.forEach(crit => {
            const isMatched = checkConceptFuzzy(userText, crit.keywords);
            if (isMatched) {
                qScore += crit.points;
                criteriaHTML += `<li class="matched">✓ [${crit.points} mark(s)]${crit.text}</li>`;
            } else {
                criteriaHTML += `<li class="missed">✗ [0/${crit.points} mark(s)]${crit.text}</li>`;
            }
        });

        if (qScore > q.marks) qScore = q.marks;
        totalScore += qScore;
        totalAttemptedMarks += q.marks;

        criteriaHTML += '</ul>';

        feedbackBox.className = 'feedback-box visible graded';
        feedbackBox.innerHTML = `
            <div class="score-display">Mark Awarded: ${qScore} /${q.marks}</div>
            <strong>Mark Scheme Breakdown:</strong>
            ${criteriaHTML}
            <div class="model-answer">
                <div class="model-answer-title">Model Answer / Key Points:</div>
                ${q.modelAnswer}
            </div>
        `;
    });

    document.getElementById('overallStats').innerText = `Attempted: ${attemptedCount}/13 | Total Score: ${totalScore} /${totalAttemptedMarks} (Max 48)`;
    alert(`Marking Complete!\nYou scored ${totalScore} mark(s) across${attemptedCount} attempted question(s).`);
}

// Export Functions
function exportJSON() {
    const studentName = document.getElementById('studentName').value || 'Student';
    const data = localStorage.getItem('pe_revision_data');
    if (!data) {
        alert('No saved data found to export.');
        return;
    }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${studentName.replace(/\s+/g, '_')}_PE_Revision_Backup.json`;
    a.click();
}
